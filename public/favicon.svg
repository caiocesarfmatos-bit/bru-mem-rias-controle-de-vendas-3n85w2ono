<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="emblemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8F4" />
      <stop offset="85%" stop-color="#FFF8F4" />
      <stop offset="100%" stop-color="#FCE7F0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3D150B" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fundo seguro do ícone -->
  <rect width="512" height="512" rx="104" fill="url(#emblemGlow)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#D49B42" stroke-width="4" stroke-opacity="0.6" />

  <!-- Emblema Principal Bru Memórias incorporado -->
  <image
    href="/assets/emblem-main.png"
    x="32"
    y="32"
    width="448"
    height="448"
    preserveAspectRatio="xMidYMid meet"
    filter="url(#shadow)"
  />
</svg>
